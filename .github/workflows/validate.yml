name: Validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate plugin repository
        run: python3 scripts/validate_repo.py
      - name: Compile Python examples
        run: python3 -m compileall -q examples skills/dspy-haystack-integration/examples
